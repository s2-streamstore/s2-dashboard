name: Release

# Builds apps/lite, commits the refreshed dist, and tags it so that s2 can pin
# the lite/dashboard submodule to the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag (e.g. 0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit dist and tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apps/lite/dist
          git diff --cached --quiet || git commit -m "release: v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD "v${{ inputs.version }}"
